name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Upload jar (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: CustomGear
          path: target/CustomGear-*.jar

      - name: Publish GitHub Release (only when you push a tag like v1.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/CustomGear-*.jar
          generate_release_notes: true
